name: IndexNow Daily Submit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit URLs to Bing IndexNow
        run: |
          curl -s -X POST "https://www.bing.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "blog.waterfish.ren",
              "key": "f4dbd82d38bd4b7aa6f60e72e1e67a6e",
              "keyLocation": "https://blog.waterfish.ren/f4dbd82d38bd4b7aa6f60e72e1e67a6e.txt",
              "urlList": [
                "https://blog.waterfish.ren",
                "https://blog.waterfish.ren/sitemap.xml"
              ]
            }'
