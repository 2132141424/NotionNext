name: IndexNow Daily Submit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to Bing IndexNow
        run: |
          KEY="f4dbd82d38bd4b7aa6f60e72e1e67a6e"
          KEY_LOCATION="https://blog.waterfish.ren/f4dbd82d38bd4b7aa6f60e72e1e67a6e.txt"
          SITEMAP="https://blog.waterfish.ren/sitemap.xml"

          # 拉取 sitemap 并逐条提交其中的 URL
          curl -s "$SITEMAP" | grep -oP '(?<=<loc>)[^<]+' | while read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -s -o /dev/null -w "%{http_code}" -G "https://www.bing.com/indexnow" \
              --data-urlencode "url=$url" \
              --data-urlencode "key=$KEY" \
              --data-urlencode "keyLocation=$KEY_LOCATION")
            echo "$code $url"
          done

      - name: Submit main domain URLs to Bing IndexNow
        run: |
          KEY="d59dc20b730c4d488e0d5929e4d95e5d"
          KEY_LOCATION="https://waterfish.ren/d59dc20b730c4d488e0d5929e4d95e5d.txt"

          for url in \
            "https://waterfish.ren" \
            "https://waterfish.ren/choose" \
            "https://board.waterfish.ren" \
            "https://ziyuan.waterfish.ren" \
            "https://mail.waterfish.ren"
          do
            code=$(curl -s -o /dev/null -w "%{http_code}" -G "https://www.bing.com/indexnow" \
              --data-urlencode "url=$url" \
              --data-urlencode "key=$KEY" \
              --data-urlencode "keyLocation=$KEY_LOCATION")
            echo "$code $url"
          done
