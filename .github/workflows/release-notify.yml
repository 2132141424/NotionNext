name: Release Notify (新文章 → 邮件通知订阅者)

# 读者在仓库页面点 Watch → Releases only 即可订阅。
# 本工作流检测到新文章后发布 release，GitHub 会把通知邮件发给订阅者，
# 送达率、退订、隐私都由 GitHub 负责，本站无需后端。
on:
  # 部署成功后由 Vercel 的 GitHub 集成（vercel[bot]）发来 deployment_status 事件，
  # 触发延迟通常在几分钟内，不必等定时任务
  deployment_status:
  schedule:
    # 兜底：万一某次部署没有产生 deployment_status 事件
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notify
  cancel-in-progress: false

jobs:
  notify:
    # 部署失败时跳过；定时与手动触发不受影响
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish release for new posts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release-notify.py

      - name: Commit tracking file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain released-posts.txt)" ]; then
            echo "No changes, skip commit"
            exit 0
          fi
          git add released-posts.txt
          git commit -m "chore: record released posts for subscriber notifications"
          # 通知提交常与 Notion 内容更新提交撞车，推之前先变基，失败再重试
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "登记文件推送失败" >&2
          exit 1
